name: CI

on:
  push:
    branches: [main, develop]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements-dev.txt
      - name: Django system checks
        run: python manage.py check --settings=config.settings.test
      - name: Run tests
        run: pytest

  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t hotel-ai-alpha:ci .

  smoke:
    runs-on: ubuntu-latest
    needs: docker
    steps:
      - uses: actions/checkout@v4
      - name: Prepare environment
        run: |
          cp .env.example .env
          sed -i 's/^DJANGO_DEBUG=.*/DJANGO_DEBUG=false/' .env
          sed -i 's/^SEED_DEMO_DATA=.*/SEED_DEMO_DATA=true/' .env
          sed -i 's/^DJANGO_SUPERUSER_PASSWORD=.*/DJANGO_SUPERUSER_PASSWORD=smokepass/' .env
      - name: Start stack
        run: docker compose up -d --build
      - name: Wait for health
        run: |
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:8000/healthz >/dev/null 2>&1; then echo "healthy"; exit 0; fi
            sleep 5
          done
          docker compose logs web
          exit 1
      - name: Run smoke test
        run: python scripts/smoke_test.py http://localhost:8000
      - name: Tear down
        if: always()
        run: docker compose down -v
