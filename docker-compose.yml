services:
  web:
    build: .
    image: hotel-ai-alpha:local
    container_name: hotel-ai-alpha
    env_file:
      - .env
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.prod
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
    ports:
      - "8000:8000"
    volumes:
      - hotel_data:/app/data
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

  scheduler:
    image: hotel-ai-alpha:local
    container_name: hotel-ai-alpha-scheduler
    env_file:
      - .env
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.prod
    volumes:
      - hotel_data:/app/data
    entrypoint: ["/bin/sh", "/app/docker/scheduler.sh"]
    # The scheduler runs management commands, not HTTP; the image healthcheck
    # (curl /healthz) does not apply to it.
    healthcheck:
      disable: true
    depends_on:
      web:
        condition: service_healthy
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: hotel-ai-alpha-redis
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  hotel_data:
  redis_data:
